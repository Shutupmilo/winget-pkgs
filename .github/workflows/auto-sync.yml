name: Auto-Sync Fork

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs automatically every day at midnight
  workflow_dispatch: # Allows us to manually trigger it

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync from Microsoft Upstream
        run: gh repo sync ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
